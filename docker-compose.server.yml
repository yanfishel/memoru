# A stand-in for the VPS on the home machine: separate project name, volumes and ports.
# Run with: docker compose -p memoru-server -f docker-compose.server.yml up -d
# Stop and wipe with: docker compose -p memoru-server -f docker-compose.server.yml down -v
services:
  postgres:
    image: postgres:18.6
    # Listens on 5433 internally too (not just 5432->5433 on the host): `docker compose exec`
    # runs pg_dump/pg_restore *inside* this container, where a host-mapped port is unreachable
    # (containers don't see the host's port-forwarding through their own localhost). Publish's
    # --dbname reuses the same DATABASE_URL for both the host-side pool and the in-container
    # tool call, so both must resolve to the same port. A real VPS runs a single postgres and
    # never remaps its port, so this quirk is local-rehearsal-only.
    command: ["-p", "5433"]
    environment:
      POSTGRES_USER: memoru
      POSTGRES_PASSWORD: memoru
      POSTGRES_DB: memoru
    ports:
      - "5433:5433"
    volumes:
      - pgdata_server:/var/lib/postgresql
      - ./.artifacts-server:/artifacts
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memoru -p 5433"]
      interval: 5s
      retries: 20

  meilisearch:
    image: getmeili/meilisearch:v1.53.2
    environment:
      MEILI_MASTER_KEY: dev-master-key-change-me
      MEILI_ENV: development
    ports:
      # 7701 is the test Meilisearch (docker-compose.yml); this rehearsal stack uses 7702.
      - "7702:7700"
    volumes:
      - meilidata_server:/meili_data

volumes:
  pgdata_server:
  meilidata_server:
