services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: memoru
      POSTGRES_PASSWORD: memoru
      POSTGRES_DB: memoru
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./.artifacts:/artifacts
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memoru"]
      interval: 5s
      retries: 20

  meilisearch:
    image: getmeili/meilisearch:v1.53.2
    environment:
      MEILI_MASTER_KEY: dev-master-key-change-me
      MEILI_ENV: development
    ports:
      - "7700:7700"
    volumes:
      - meilidata:/meili_data

  meilisearch-test:
    image: getmeili/meilisearch:v1.53.2
    environment:
      MEILI_MASTER_KEY: dev-master-key-change-me
      MEILI_ENV: development
    ports:
      - "7701:7700"
    volumes:
      - meilidata_test:/meili_data

volumes:
  pgdata:
  meilidata:
  meilidata_test:
